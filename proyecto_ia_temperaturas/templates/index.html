<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas con IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg mx-auto" style="max-width: 500px;">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Conversor de IA 🧠</h3>
            </div>
            <div class="card-body">
                <form id="conversionForm">
                    <div class="mb-3">
                        <label for="celsiusInput" class="form-label">Temperatura en Grados Celsius (°C):</label>
                        <input type="number" step="any" class="form-control" id="celsiusInput" required value="25">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Convertir</button>
                </form>

                <hr>

                <h4 class="mt-4">Resultados de la IA:</h4>
                <p>Fahrenheit (°F): <strong id="resultFahrenheit" class="text-danger">--</strong></p>
                <p>Kelvin (K): <strong id="resultKelvin" class="text-info">--</strong></p>
            </div>
        </div>
        <p class="text-center text-muted mt-3">Usando Modelos de TensorFlow (Keras) vía Flask API.</p>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
