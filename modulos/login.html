<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Académico UGB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            background: linear-gradient(135deg, #0056b3 0%, #003366 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .login-body {
            padding: 2.5rem;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #0056b3 0%, #003366 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
        }
        
        .ugb-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            /* Esta es la línea que resuelve el comentario: */
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-container">
                    <div class="login-header">
                        <i class="bi bi-mortarboard-fill ugb-logo"></i>
                        <h2 class="mb-2">Sistema Académico UGB</h2>
                        <p class="mb-0 opacity-75">Universidad Gerardo Barrios</p>
                    </div>
                    
                    <div class="login-body">
                        <form id="frmLogin">
                            <div class="mb-4">
                                <label for="txtUsuario" class="form-label fw-semibold">
                                    <i class="bi bi-person-fill me-2 text-primary"></i>Usuario
                                </label>
                                <input type="text" class="form-control" id="txtUsuario" required autofocus placeholder="Ingrese su usuario">
                            </div>

                            <div class="mb-4">
                                <label for="txtClave" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill me-2 text-primary"></i>Contraseña
                                </label>
                                <input type="password" class="form-control" id="txtClave" required placeholder="Ingrese su contraseña">
                            </div>

                            <button type="submit" class="btn btn-login text-white w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                            </button>
                            
                            <div class="text-center">
                                <small class="text-muted">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Usuario: admin | Contraseña: admin123
                                </small>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const frmLogin = document.getElementById('frmLogin');

        frmLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!txtUsuario.value.trim() || !txtClave.value.trim()) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Por favor complete todos los campos',
                    confirmButtonColor: '#0056b3'
                });
                return;
            }

            Swal.fire({
                title: 'Verificando credenciales...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            const datos = {
                usuario: txtUsuario.value,
                clave: txtClave.value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await response.json();

                if (resultado.status === 'ok') {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido!',
                        text: `Hola ${resultado.usuario}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        sessionStorage.setItem('usuario', resultado.usuario);
                        sessionStorage.setItem('rol', resultado.rol);
                        window.location.href = '/index.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de autenticación',
                        text: resultado.msg,
                        confirmButtonColor: '#dc3545'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor',
                    confirmButtonColor: '#dc3545'
                });
            }
        });
    </script>
</body>
</html>
